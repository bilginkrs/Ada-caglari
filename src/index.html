function technologyPanel(logisticsOnly=false){
  const island=state.islands[state.you];
  const branches=logisticsOnly?['Lojistik']:CATEGORIES;
  const entries=Object.entries(treeData);
  const visible=entries.filter(([,tech])=>branches.includes(tech.branch));
  if(!visible.some(([id])=>id===selectedTechnology))selectedTechnology=visible[0][0];
  const tech=treeData[selectedTechnology];
  const sig=JSON.stringify([logisticsOnly,selectedTechnology,island.cityLevel,island.tech,island.research,island.rp,island.universityLevel,state.running,
    Object.keys(tech.cost).map(g=>island.stock[g])]);
  if(sig===techSignature)return;
  techSignature=sig;
  el('heading').textContent=logisticsOnly?'Lojistik geliştirmeleri':'Teknoloji ağacı';
  const container=el('content');
  const previousDetails=el('technology-details');
  if(previousDetails&&previousDetails.dataset.node===selectedTechnology&&previousDetails.dataset.scope===String(logisticsOnly)){
    updateTechnologyDetails(previousDetails,island,selectedTechnology,tech);
    return;
  }
  const graphScroll=container.querySelector('.technology-graph')?.scrollTop||0;
  container.replaceChildren();
  const graph=document.createElement('div');
  graph.className='technology-graph';
  for(const branch of branches){
    const section=document.createElement('section');
    text(section,branch,'h3');
    const lane=document.createElement('div');
    lane.className='technology-lane';
    for(const [id,node] of visible.filter(([,item])=>item.branch===branch).sort((a,b)=>a[1].level-b[1].level)){
      const control=button(lane,'',()=>{
        selectedTechnology=id;
        techSignature='';
        technologyPanel(logisticsOnly);
      });
      control.className='technology-node';
      control.dataset.tech=id;
      control.append(spritePreview(logisticsSprites[id]||techSprites[branch]));
      text(control,'Seviye '+node.level,'small').className='node-level';
      text(control,node.name,'span');
      text(control,'','small').className='node-state';
    }
    section.append(lane);
    graph.append(section);
  }
  container.append(graph);
  graph.scrollTop=graphScroll;
  const detail=document.createElement('section');
  detail.id='technology-details';
  detail.dataset.node=selectedTechnology;
  detail.dataset.scope=String(logisticsOnly);
  detail.className='technology-details';
  container.append(detail);
  text(detail,tech.name+' · Seviye '+tech.level,'h3');
  text(detail,tech.unlock);
  const prerequisites=document.createElement('div');
  prerequisites.className='technology-prerequisites';
  for(const key of tech.requires){
    button(prerequisites,treeData[key].name,()=>{
      if(logisticsOnly&&treeData[key].branch!=='Lojistik')openSubPanel('tech',()=>{selectedTechnology=key;});
      else{selectedTechnology=key;technologyPanel(logisticsOnly);}
    }).dataset.prerequisite=key;
  }
  if(prerequisites.childElementCount||tech.university||tech.cityLevel){
    text(detail,'Ön koşullar','h4');
    detail.append(prerequisites);
  }
  if(tech.cityLevel)text(detail,'').id='technology-city-requirement';
  if(tech.university)text(detail,'').id='university-requirement';
  for(const [g,n] of Object.entries(tech.cost))stockRequirement(detail,g,n,'research-'+g);
  text(detail,'').id='research-points';
  const start=button(detail,'Araştır',()=>send({type:'research',id:selectedTechnology}));
  start.id='start-research';
  start.className='primary-action';
  if(logisticsOnly)button(detail,'Tüm teknoloji dalları',()=>openSubPanel('tech'));
  updateTechnologyDetails(detail,island,selectedTechnology,tech);
}

function updateTechnologyDetails(detail,island,id,tech){
  for(const control of el('content').querySelectorAll('[data-tech]')){
    const key=control.dataset.tech;
    const done=island.tech.includes(key);
    const active=island.research?.id===key;
    const unlocked=treeData[key].requires.every(req=>island.tech.includes(req))&&
      (island.universityLevel||0)>=(treeData[key].university||0)&&island.cityLevel>=treeData[key].cityLevel;
    control.dataset.done=String(done);
    control.setAttribute('aria-pressed',String(key===id));
    control.querySelector('.node-state').textContent=done?'✓ Tamamlandı':active?'◷ Araştırılıyor':unlocked?'Açık':'▣ Kilitli';
  }
  for(const control of detail.querySelectorAll('[data-prerequisite]')){
    const key=control.dataset.prerequisite;
    control.textContent=(island.tech.includes(key)?'✓ ':'○ ')+treeData[key].name;
  }
  for(const [g,n] of Object.entries(tech.cost))updateRequirement('research-'+g,island.stock[g],n);
  el('research-points').textContent=island.rp+' / '+tech.rp+' araştırma puanı · '+tech.time+' sn';
  if(tech.cityLevel){
    el('technology-city-requirement').textContent=(island.cityLevel>=tech.cityLevel?'✓ ':'○ ')+
      'Şehir seviyesi '+(island.cityLevel+1)+' / '+(tech.cityLevel+1)+' · '+cityTiers[tech.cityLevel].name;
  }
  if(tech.university){
    const level=island.universityLevel||0;
    el('university-requirement').textContent=(level>=tech.university?'✓ ':'○ ')+
      'Üniversite seviyesi '+level+' / '+tech.university;
  }
  const start=el('start-research');
  const done=island.tech.includes(id);
  start.textContent=done?'✓ Tamamlandı':island.research?.id===id?'Araştırılıyor · '+island.research.remaining+' sn':'Araştır';
  start.disabled=!state.running||!!island.research||done||island.rp<tech.rp||island.cityLevel<tech.cityLevel||(island.universityLevel||0)<(tech.university||0)||
    !tech.requires.every(key=>island.tech.includes(key))||
    !Object.entries(tech.cost).every(([g,n])=>island.stock[g]>=n);
}

function drawCityTile(island,x,y,point){
  const level=island.cityLevel||0;
  if(island.universityLevel&&x===30&&y===30){
    pixelObject('city-university',point.x,point.y+21,0,.8+.06*island.universityLevel);
    return;
  }
  const landmark=cityLandmarks.find(item=>item.x===x&&item.y===y&&level>=item.level);
  if(landmark){
    pixelObject(landmark.kind,point.x,point.y+21,0,.82);
    return;
  }
  if(!cityHouse(island,x,y))return;
  const scale=level>=2?.68:level===1?.82:1;
  pixelObject('city',point.x,point.y+19,0,scale);
}
const cityLandmarks=[
  {x:28,y:28,kind:'city-park',level:1},
  {x:30,y:27,kind:'city-mosque',level:1},
  {x:29,y:30,kind:'city-theater',level:2},
  {x:31,y:29,kind:'city-cathedral',level:3}
];

function cityHouse(island,x,y){
  if(x%2 && y%2)return true;
  if(island.cityLevel>=1 && x%2===0 && y%2===0)return true;
  if(island.cityLevel>=2 && x===30)return true;
  return (island.cityLevel>=3&&y===28)||(island.cityLevel>=4&&x+y<=54+island.cityLevel);
}

function hasMarketShip(quantity){
  return state.ships.some(ship=>ship.owner===state.you&&ship.stage==='home'&&!ship.enabled&&
    !ship.contract&&!ship.mission&&!ship.purchase&&!ship.expedition&&!loadCount(ship)&&(ship.capacity||20)>=quantity);
}

function canBuyListing(offer,seller,buyer){
  return state.running&&buyer.money>=offer.gold&&(offer.reserved||seller.stock[offer.good]>=offer.quantity)&&
    buyer.plots.some(building=>building.kind==='liman')&&hasMarketShip(offer.quantity);
}

function marketSignature(seller,buyer){
  return Object.values(seller.listings||{}).map(offer=>canBuyListing(offer,seller,buyer));
}

function portMarket(container,island){
  const own=selected===state.you||island.controller===state.you;
  const buyer=state.islands[state.you];
  if(own){
    text(container,'Her ilan tek bir parti içindir. Fiyat, partinin tamamı için ödenecek altındır.');
    const good=field(container,'Satılacak malzeme','wood',names);
    const quantity=field(container,'Parti miktarı (1–40)',10);
    const gold=field(container,'Partinin toplam fiyatı (altın)',5);
    button(container,'İlanı yayınla / güncelle',()=>send({type:'setListing',island:selected,good:good.value,quantity:Number(quantity.value),gold:Number(gold.value)}));
  }else{
    text(container,'Satın aldığında ana limanındaki boş gemi bu limana gider. Ürünler gemi dönünce depoya girer.');
    if(!buyer.plots.some(b=>b.kind==='liman'))text(container,'Önce kendi adana bir liman kur.');
  }
  voyageCards(container,own?null:selected);
  const offers=Object.values(island.listings||{});
  if(!offers.length)text(container,'Bu limanda açık satış ilanı yok.');
  for(const offer of offers)listingCard(container,offer,island,selected,buyer);
  updateVoyages();
}

function listingCard(container,offer,seller,index,buyer){
  const own=index===state.you||seller.controller===state.you;
  const card=document.createElement('section');
  card.className='market-offer';
  const heading=document.createElement('div');
  heading.className='market-offer-heading';
  heading.append(productChip(offer.good,offer.quantity+' '+names[offer.good]));
  text(heading,offer.gold+' altın','strong').className='gold-price';
  card.append(heading);
  if(own){
    button(card,'İlanı kaldır',()=>send({type:'removeListing',island:index,good:offer.good})).disabled=!state.running;
  }else{
    const buy=button(card,'Satın al ve gemiyi gönder',()=>send({type:'buyListing',target:index,id:offer.id}));
    buy.className='primary-action';
    buy.disabled=!canBuyListing(offer,seller,buyer);
    if(buy.disabled)text(card,sellerListingBlock(offer,seller,buyer));
  }
  container.append(card);
}

let marketplaceSide='sell',postSide=null;

function marketplacePanel(){
  const content=el('content');
  const buyer=state.islands[state.you];
  const ports=state.islands.map((island,index)=>({island,index}))
    .filter(({island})=>island.owner&&island.plots.some(building=>building.kind==='liman'));
  const own=({island,index})=>index===state.you||island.controller===state.you;
  const portOptions=Object.fromEntries(ports.filter(own).map(({island,index})=>[index,island.name]));
  const formKey=JSON.stringify(portOptions);
  if(el('market-form')?.dataset.ports!==formKey){
    extraSignature='';
    content.replaceChildren();
    el('heading').textContent='Ticaret Pazarı';
    const tools=document.createElement('nav');
    tools.className='market-tools';
    for(const [side,label] of [['sell','Satış ilanları'],['buy','Alım ilanları']]){
      const tab=button(tools,label,()=>{marketplaceSide=side;marketplacePanel();});
      tab.dataset.marketSide=side;
    }
    const publish=button(tools,'İlan ver',()=>{
      postSide=postSide?null:marketplaceSide;
      marketplacePanel();
    });
    publish.id='market-publish';
    content.append(tools);
    const form=document.createElement('section');
    form.id='market-form';
    form.dataset.ports=formKey;
    const modes=document.createElement('div');
    modes.className='market-post-modes';
    for(const [side,label] of [['sell','Satmak istiyorum'],['buy','Satın almak istiyorum']]){
      const mode=button(modes,label,()=>{postSide=side;marketplacePanel();});
      mode.dataset.postSide=side;
    }
    form.append(modes);
    if(!Object.keys(portOptions).length)text(form,'İlan vermek için bir liman kur.');
    else{
      const port=field(form,'Liman',Object.keys(portOptions)[0],portOptions);
      const good=field(form,'Ürün','wood',names);
      const quantity=field(form,'Parti miktarı (1–40)',10);
      const gold=field(form,'Partinin toplam fiyatı (altın)',5);
      const submit=button(form,'İlanı yayınla',()=>send({
        type:postSide==='buy'?'setBuyListing':'setListing',island:Number(port.value),good:good.value,
        quantity:Number(quantity.value),gold:Number(gold.value)
      }));
      submit.id='market-list-submit';
      text(form,'','small').id='market-post-note';
    }
    content.append(form);
    button(content,state.mode==='test'?'Gezgin tüccar ve takas':'Takas ve otomatik ticaret',
      ()=>openSubPanel('trade',()=>{selected=state.you;}));
    const offers=document.createElement('div');
    offers.id='market-list';
    content.append(offers);
    const tracking=document.createElement('div');
    tracking.id='market-tracking';
    content.append(tracking);
  }
  el('market-form').hidden=!postSide;
  el('market-publish').setAttribute('aria-expanded',String(!!postSide));
  for(const tab of content.querySelectorAll('[data-market-side]'))tab.setAttribute('aria-pressed',String(tab.dataset.marketSide===marketplaceSide));
  for(const mode of content.querySelectorAll('[data-post-side]'))mode.setAttribute('aria-pressed',String(mode.dataset.postSide===postSide));
  const submit=el('market-list-submit');
  if(submit){
    submit.disabled=!state.running;
    submit.textContent=postSide==='buy'?'Alım ilanını yayınla':'Satış ilanını yayınla';
    el('market-post-note').textContent=postSide==='buy'?
      'Teklif ettiğin altın ilanda ayrılır. Satıcı yükü limanına teslim edince ödemesini alır.':
      'Ürünler depodan ayrılır. Alıcı, gemisini limanına gönderir.';
  }
  const selling=marketplaceSide==='sell';
  const listings=ports.map(entry=>({...entry,offers:Object.values(selling?entry.island.listings:entry.island.buyListings||{})}))
    .filter(({offers})=>offers.length);
  const signature=JSON.stringify([marketplaceSide,state.running,listings.map(({island,index,offers})=>[
    index,island.owner,offers,offers.map(offer=>selling?(canBuyListing(offer,island,buyer)?null:sellerListingBlock(offer,island,buyer)):
      buyRequestBlock(offer,buyer))
  ]),state.ships.map(ship=>[ship.portOrder?.offerId,ship.mission?.marketOrder])]);
  if(signature!==extraSignature){
    extraSignature=signature;
    const offers=el('market-list');
    offers.replaceChildren();
    text(offers,selling?'Satış ilanları':'Alım ilanları','h3');
    if(!listings.length)text(offers,selling?'Açık satış ilanı yok.':'Açık alım ilanı yok.');
    for(const entry of listings){
      const {island,index}=entry;
      text(offers,island.owner+' · '+island.name,'h4');
      for(const offer of entry.offers){
        if(selling)listingCard(offers,offer,island,index,buyer);
        else buyRequestCard(offers,offer,index,own(entry),buyer);
      }
    }
    const tracking=el('market-tracking');
    tracking.replaceChildren();
    voyageCards(tracking);
    for(const [index,ship] of state.ships.entries()){
      if(!ship.mission?.marketOrder||(ship.owner!==state.you&&state.islands[ship.to].controller!==state.you))continue;

function facilityIssue(island,building){
  const recipe=recipes[building.kind];
  if(!recipe?.out || !island.owner)return null;
  const good=building.extract||recipe.out;
  const amount=1+island.productionLevel;
  const inputs=recipe.inputs || (recipe.input?{[recipe.input]:1}:{});
  if(building.worker?.stage==='blocked')return {symbol:'!',label:'Kaynağa yol yok'};
  if(building.kind==='balik'&&!nearWater(island,selected,building.x,building.y))return {symbol:'!',label:'Su kenarı gerekli'};
  if((building.output?.[good]||0)+amount>50)return {symbol:'▣',label:'Çıkış dolu'};
  if(Object.entries(inputs).some(([key,n])=>(building.inventory?.[key]||0)<n*amount))
    return {symbol:'⌛',label:'Teslimat bekliyor'};
  return null;
}

function updateFacility(island,building){
  const recipe=recipes[building.kind];
  const good=building.extract||recipe.out;
  const inputs=recipe.inputs || (recipe.input?{[recipe.input]:1}:{});
  const amount=1+island.productionLevel;
  const issue=facilityIssue(island,building);
  const badge=el('facility-status');
  if(!badge)return;
  badge.className='state-pill '+(issue?'waiting':'ready');
  badge.textContent=issue?issue.symbol+' '+issue.label:'● '+(building.worker?building.status||'Çalışıyor':'Çalışıyor');
  for(const [key,n] of Object.entries(inputs))updateRequirement('input-'+key,building.inventory?.[key]||0,n*amount);
  const missing=Object.entries(inputs).find(([key,n])=>(building.inventory?.[key]||0)<n*amount);
  let reason='Üretim için gereken koşullar karşılanıyor.';
  if(issue && missing){
    const [key]=missing;
    const delivery=island.deliveries.find(d=>d.to===building.id&&d.good===key&&d.stage!=='return');
    reason='Depoda '+(island.stock[key]||0)+' '+names[key].toLocaleLowerCase('tr-TR')+' var. '+
      (delivery?.blocked?'Taşıyıcı yol bekliyor.':delivery?.stage==='loaded'?'Yük tesise geliyor.':delivery?'Taşıyıcı depodan yük almaya gidiyor.':island.stock[key]>0?'Teslimat sırada.':'Depoya stok gelmesi gerekiyor.');
  }
  if(issue?.symbol==='▣')reason='Ürünler çıkışta birikti. Taşıyıcı yükü depoya götürünce üretim devam eder.';
  if(issue?.symbol==='!')reason=issue.label+'.';
  el('facility-reason').textContent=reason;
  const output=building.output?.[good]||0;
  el('facility-output').textContent=output+' adet tesiste bekliyor';
  el('facility-rate').textContent='Son dakikada üretilen · '+(building.actual||0);
}

function islandTerrainLayer(island,index){
  const key=JSON.stringify(island.terrainOverrides||{});
  const cached=mapTerrainCache.get(index);
  if(cached?.key===key)return cached;
  const terrain=new Map();
  const shores=[];
  const at=(x,y)=>terrain.get(x+','+y)||'sea';
  for(let x=0;x<36;x++)for(let y=0;y<36;y++)terrain.set(x+','+y,terrainAt(x,y,index,island));
  for(let x=-2;x<=37;x++)for(let y=-2;y<=37;y++){
    if(at(x,y)!=='sea')continue;
    let distance=3;
    for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=2;dy++){
      const steps=Math.abs(dx)+Math.abs(dy);
      if(steps<distance&&at(x+dx,y+dy)!=='sea')distance=steps;
    }
    if(distance<3)shores.push({x,y,distance});
  }
  const next={key,at,shores};
  mapTerrainCache.set(index,next);
  return next;
}

function drawIslandShallows(island,index){
  const {shores}=islandTerrainLayer(island,index);
  for(const {x,y,distance} of shores){
    const p=tile(x,y),sx=p.x*zoom+pan.x,sy=p.y*zoom+pan.y;
    if(sx< -75||sx>W+75||sy< -50||sy>H+50)continue;
    poly([[p.x,p.y],[p.x+32,p.y+19],[p.x,p.y+38],[p.x-32,p.y+19]],distance===1?'#60bac2':'#419aaF');
    if(distance===1&&((x+2*y+index)%5===0)){
      const drift=Math.sin(anim*1.6+x+y)*3;
      ctx.fillStyle='#a4dcce';
      ctx.fillRect(Math.round(p.x-7+drift),p.y+18,12,2);
      ctx.fillRect(Math.round(p.x+5+drift),p.y+20,5,1);
    }
  }
}

function silhouetteFor(island,index){
  const layer=islandTerrainLayer(island,index);
  const tier=island.cityLevel||0;
  const hasPort=island.plots.some(b=>b.kind==='liman');
  const hasIndustry=island.plots.length>=7;
  const key=JSON.stringify([layer.key,tier,hasPort,hasIndustry,island.universityLevel]);
  const cached=worldSilhouettes.get(index);
  if(cached?.key===key)return cached.image;
  const image=document.createElement('canvas');
  image.width=192;image.height=144;
  const g=image.getContext('2d');
  g.imageSmoothingEnabled=false;
  const profile=landProfiles[index];
  const pos=(x,y)=>[Math.round(96+(x-y)*2*profile.width),Math.round(81+(x+y-36)*1.12*profile.height)];
  const cell=(x,y,color)=>{
    const [px,py]=pos(x,y);
    g.fillStyle=color;
    g.fillRect(px-2,py,Math.ceil(4*profile.width)+1,3);
  };
  for(const depth of [2,1]){
    for(const shore of layer.shores)if(shore.distance===depth)
      cell(shore.x,shore.y,depth===2?'#419bb1':'#64bdc1');
  }
  const forest=[],rock=[];
  for(let depth=0;depth<=70;depth++)for(let x=Math.max(0,depth-35);x<=Math.min(35,depth);x++){
    const y=depth-x,type=layer.at(x,y);
    if(type==='sea')continue;
    const color={coast:'#eed093',lake:'#58afb9',mountain:'#858777',rock:'#929680',forest:'#547f43',city:'#ccad79'}[type];
    cell(x,y,color||(profile.trees>9?'#87a956':'#a6b571'));
    if(type==='forest')forest.push([x,y]);
    if(type==='mountain'||type==='rock')rock.push([x,y]);
  }
  const decorations=[];
  for(const [positions,count,kind] of [[forest,profile.trees,'tree'],[rock,profile.rocks,'mountain']]){
    for(let n=0;n<count&&positions.length;n++){
      const [x,y]=positions[Math.floor((n+.5)*positions.length/count)];
      decorations.push({x,y,kind,size:kind==='tree'?16:(profile.rocks>7?30:19)});
    }
  }
  if(hasPort)decorations.push({x:31,y:28,kind:'liman',size:27});
  if(hasIndustry||tier){
    for(let n=0;n<2+tier;n++)decorations.push({x:27+n,y:27+n%2,kind:'city',size:19+n%2*3});
  }
  if(island.universityLevel)decorations.push({x:32,y:29,kind:'city-university',size:28});
  decorations.sort((a,b)=>a.x+a.y-b.x-b.y);
  for(const {x,y,kind,size} of decorations){
    const [px,py]=pos(x,y);
    g.drawImage(sprite(kind),px-size/2,py-size*.78,size,size);
  }
  worldSilhouettes.set(index,{key,image});
  return image;
}
